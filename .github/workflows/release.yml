name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install base dependencies
        run: pacman -Syu --noconfirm git
        
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Install build dependencies
        run: pacman -Syu --noconfirm base-devel cmake qt6-base exiv2 zip
        
      - name: Build and Package
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Sura-release
          path: Sura-release.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Download Artifact
        uses: actions/download-artifact@v3
        with:
          name: Sura-release
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: Sura-release.zip
          generate_release_notes: true

      - name: Keep only 2 most recent tags and releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAGS=$(git tag -l 'v*' | sort -rV)
          mapfile -t TAG_ARRAY <<< "$TAGS"
          
          if [ ${#TAG_ARRAY[@]} -gt 2 ]; then
            for (( i=2; i<${#TAG_ARRAY[@]}; i++ )); do
              TAG_TO_DELETE="${TAG_ARRAY[$i]}"
              echo "Deleting old tag and release: $TAG_TO_DELETE"
              gh release delete "$TAG_TO_DELETE" -y || true
              git push origin --delete "$TAG_TO_DELETE" || true
            done
          else
            echo "2 or fewer tags found, nothing to delete."
          fi
